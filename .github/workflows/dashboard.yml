name: Build dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout application profiles library
        uses: actions/checkout@v5
        with:
          repository: entsoe/application-profiles-library
          ref: main
          path: application-profiles-library

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build complete dashboard
        working-directory: relicap-ap-shacl-eval
        run: python3 collect-results.py

      - name: Stage complete dashboard
        run: |
          mkdir -p _site
          cp relicap-ap-shacl-eval/index.html _site/
          cp relicap-ap-shacl-eval/dashboard.css _site/
          cp relicap-ap-shacl-eval/validation-results.html _site/
          cp relicap-ap-shacl-eval/validation-results.csv _site/
          cp -R relicap-ap-shacl-eval/dashboard _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-dashboard:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - name: Deploy complete dashboard
        id: deployment
        uses: actions/deploy-pages@v4
