name: Upload timing and validation results

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  upload-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upload timing-results.html artifact
        uses: actions/upload-artifact@v5
        with:
          name: timing-results
          path: timing-results.html

      - name: Upload validation-results.html artifact
        uses: actions/upload-artifact@v5
        with:
          name: validation-results
          path: validation-results.html

      - name: Upload index.html artifact
        uses: actions/upload-artifact@v5
        with:
          name: index
          path: index.html

